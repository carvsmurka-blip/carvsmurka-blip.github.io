<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой AI Чат</title>
    <!-- Подключаем Tailwind CSS для красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between">

    <!-- Верхняя панель -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold text-purple-400 flex items-center gap-2">
            🤖 AI Чат
        </h1>
        <button onclick="toggleSettings()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            ⚙️ Ключ API
        </button>
    </header>

    <!-- Выпадающая панель настроек для ключа -->
    <div id="settingsPanel" class="hidden bg-slate-800 border-b border-slate-700 p-4 transition-all">
        <label class="block text-xs text-slate-400 mb-1">Введи свой Gemini API ключ:</label>
        <div class="flex gap-2">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
            <button onclick="saveApiKey()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Сохранить</button>
        </div>
        <p class="text-[11px] text-slate-500 mt-1">Ключ хранится только в твоём браузере и никуда не передаётся.</p>
    </div>

    <!-- Основная область чата -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="bg-purple-600 text-white rounded-2xl px-4 py-3 text-sm max-w-[85%] shadow-sm">
                Привет! Введи свой API-ключ в настройках сверху (кнопка «⚙️ Ключ API»), а затем напиши мне что-нибудь.
            </div>
        </div>
    </main>

    <!-- Панель ввода сообщения -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3">
        <form id="chatForm" onsubmit="sendMessage(event)" class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="Напиши сообщение..." autocomplete="off" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
            <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-3 rounded-xl font-medium transition flex items-center justify-center">
                ➤
            </button>
        </form>
    </footer>

    <script>
        // Загружаем сохраненный ключ при запуске
        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('Ключ успешно сохранен в браузере!');
                toggleSettings();
            } else {
                alert('Введите действующий ключ!');
            }
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');

            if (!text) return;

            if (!apiKey) {
                alert('Сначала укажи свой API-ключ в настройках (кнопка вверху справа)!');
                toggleSettings();
                return;
            }

            // Добавляем сообщение пользователя в чат
            appendMessage(text, 'user');
            input.value = '';

            // Индикатор загрузки
            const loadingId = appendMessage('Думаю...', 'bot', true);

            try {
                // Запрос к Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                
                // Удаляем индикатор загрузки
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    appendMessage(botReply, 'bot');
                } else {
                    appendMessage('Ошибка: Не удалось получить ответ. Проверь правильность ключа.', 'bot');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Ошибка соединения с сервером.', 'bot');
            }
        }

        function appendMessage(text, sender, isLoading = false) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            const msgId = 'msg-' + Date.now();
            messageDiv.id = msgId;

            if (sender === 'user') {
                messageDiv.className = 'flex justify-end';
                messageDiv.innerHTML = `<div class="bg-slate-800 border border-slate-700 text-white rounded-2xl px-4 py-3 text-sm max-w-[85%] shadow-sm">${escapeHtml(text)}</div>`;
            } else {
                messageDiv.className = 'flex justify-start';
                messageDiv.innerHTML = `<div class="bg-purple-600 text-white rounded-2xl px-4 py-3 text-sm max-w-[85%] shadow-sm">${isLoading ? text : escapeHtml(text)}</div>`;
            }

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            return msgId;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
