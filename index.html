<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой ИИ-чат</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1220; color: #e8eaf6;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 16px; display: flex; justify-content: space-between;
    align-items: center; background: #171a2e; border-bottom: 1px solid #262a45;
  }
  header h1 { font-size: 18px; margin: 0; }
  header button {
    background: none; border: 1px solid #3a3f66; color: #aab0d8;
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .msg {
    max-width: 85%; padding: 10px 14px; margin: 8px 0;
    border-radius: 16px; line-height: 1.45; white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user { background: #4c5bd4; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot { background: #1e2240; margin-right: auto; border-bottom-left-radius: 4px; }
  .err { background: #5a1f2b; margin-right: auto; }
  form {
    display: flex; gap: 8px; padding: 10px;
    background: #171a2e; border-top: 1px solid #262a45;
  }
  textarea {
    flex: 1; resize: none; background: #0f1220; color: #e8eaf6;
    border: 1px solid #3a3f66; border-radius: 12px; padding: 10px 12px;
    font-size: 16px; font-family: inherit; max-height: 120px;
  }
  #send {
    background: #4c5bd4; color: #fff; border: none; border-radius: 12px;
    padding: 0 18px; font-size: 16px;
  }
  #send:disabled { opacity: .5; }
  #keybox {
    position: fixed; inset: 0; background: #0f1220ee; display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  #keybox .card {
    background: #171a2e; border: 1px solid #3a3f66; border-radius: 16px;
    padding: 20px; width: 100%; max-width: 420px;
  }
  #keybox h2 { margin: 0 0 8px; font-size: 18px; }
  #keybox p { margin: 0 0 12px; color: #aab0d8; font-size: 14px; line-height: 1.4; }
  #keybox input {
    width: 100%; background: #0f1220; color: #e8eaf6; border: 1px solid #3a3f66;
    border-radius: 10px; padding: 12px; font-size: 16px; margin-bottom: 12px;
  }
  #keybox button {
    width: 100%; background: #4c5bd4; color: #fff; border: none;
    border-radius: 10px; padding: 12px; font-size: 16px;
  }
</style>
</head>
<body>

<header>
  <h1>🤖 Мой ИИ-чат</h1>
  <div>
    <button id="clearBtn">Очистить</button>
    <button id="keyBtn">Ключ</button>
  </div>
</header>

<div id="chat"></div>

<form id="form">
  <textarea id="input" rows="1" placeholder="Напиши вопрос..."></textarea>
  <button id="send" type="submit">➤</button>
</form>

<div id="keybox">
  <div class="card">
    <h2>Вставь ключ Gemini</h2>
    <p>Ключ сохранится только в твоём браузере на этом телефоне. В коде сайта его нет.</p>
    <input id="keyInput" type="password" placeholder="AIza..." autocomplete="off">
    <button id="saveKey">Сохранить</button>
  </div>
</div>

<script>
  var MODEL = "gemini-2.5-flash";
  var chat = document.getElementById("chat");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var keybox = document.getElementById("keybox");
  var keyInput = document.getElementById("keyInput");
  var history = [];

  function getKey() {
    try { return localStorage.getItem("gemini_key") || ""; } catch (e) { return ""; }
  }
  function setKey(k) {
    try { localStorage.setItem("gemini_key", k); } catch (e) {}
  }

  function showKeybox() { keybox.style.display = "flex"; keyInput.focus(); }

  function addMsg(text, cls) {
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  document.getElementById("saveKey").onclick = function () {
    var k = keyInput.value.trim();
    if (!k) return;
    setKey(k);
    keyInput.value = "";
    keybox.style.display = "none";
  };
  document.getElementById("keyBtn").onclick = showKeybox;
  document.getElementById("clearBtn").onclick = function () {
    history = [];
    chat.innerHTML = "";
    addMsg("Привет! Задай мне любой вопрос.", "bot");
  };

  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    var key = getKey();
    if (!key) { showKeybox(); return; }

    addMsg(text, "user");
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    history.push({ role: "user", parts: [{ text: text }] });

    var wait = addMsg("Думаю...", "bot");
    try {
      var res = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent",
        {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": key },
          body: JSON.stringify({ contents: history })
        }
      );
      var data = await res.json();
      if (!res.ok) {
        var msg = (data.error && data.error.message) || "Ошибка " + res.status;
        history.pop();
        wait.className = "msg err";
        wait.textContent = "Ошибка: " + msg;
        if (res.status === 400 || res.status === 403) {
          wait.textContent += "\n\nПроверь ключ: нажми кнопку «Ключ» и вставь заново.";
        }
      } else {
        var answer = data.candidates && data.candidates[0] &&
          data.candidates[0].content && data.candidates[0].content.parts
          ? data.candidates[0].content.parts.map(function (p) { return p.text || ""; }).join("")
          : "Пустой ответ. Попробуй переформулировать вопрос.";
        history.push({ role: "model", parts: [{ text: answer }] });
        wait.textContent = answer;
      }
    } catch (err) {
      history.pop();
      wait.className = "msg err";
      wait.textContent = "Нет связи с сервером. Проверь интернет.";
    }
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  });

  addMsg("Привет! Задай мне любой вопрос.", "bot");
  if (!getKey()) showKeybox();
</script>
</body>
</html>
