<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      background-image: radial-gradient(circle at 50% 105%, #071936 0%, #030b1a 40%, #000000 75%);
      color: #e3e3e3;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      z-index: 10;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #c4c7c5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
    }

    .icon-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 18px;
      font-weight: 500;
      color: #e3e3e3;
      cursor: pointer;
      background: none;
      border: none;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .temp-chat-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px dashed #8e918f;
      background: none;
      color: #c4c7c5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .upgrade-btn {
      background-color: #0b3578;
      color: #a8c7fa;
      border: none;
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #e86c00;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    /* Центральная область / Чат */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 0 20px;
      scroll-behavior: smooth;
    }

    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-bottom: 40px;
    }

    .sparkle-icon {
      width: 44px;
      height: 44px;
      margin-bottom: 16px;
    }

    .welcome-text {
      font-size: 28px;
      font-weight: 400;
      color: #e3e3e3;
      letter-spacing: -0.3px;
    }

    /* Сообщения в чате */
    .chat-messages {
      display: none;
      flex-direction: column;
      gap: 18px;
      padding: 12px 0 24px 0;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      line-height: 1.55;
      font-size: 15px;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: #1e1f20;
      color: #e3e3e3;
      padding: 12px 16px;
      border-radius: 20px 20px 4px 20px;
    }

    .message.ai {
      align-self: flex-start;
      color: #e3e3e3;
      padding: 4px 0;
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: flex-start;
    }

    .ai-badge {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .ai-content {
      white-space: pre-wrap;
    }

    /* Нижняя панель ввода */
    .bottom-bar {
      padding: 10px 16px 22px 16px;
      display: flex;
      justify-content: center;
    }

    .input-pill {
      width: 100%;
      max-width: 720px;
      background-color: #1b1c1d;
      border-radius: 32px;
      padding: 8px 10px 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .plus-btn {
      background: none;
      border: none;
      color: #c4c7c5;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
    }

    .chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #e3e3e3;
      font-size: 16px;
      min-width: 0;
    }

    .chat-input::placeholder {
      color: #8e918f;
    }

    .mic-btn {
      background: none;
      border: none;
      color: #c4c7c5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
    }

    .live-send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #0b3578;
      color: #a8c7fa;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, background-color 0.2s;
    }

    .live-send-btn:active {
      transform: scale(0.94);
    }

    /* Модальное окно настроек ключа */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: #1e1f20;
      padding: 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal h3 {
      font-size: 18px;
      font-weight: 500;
    }

    .modal input, .modal select {
      background: #131314;
      border: 1px solid #444746;
      color: #e3e3e3;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      padding: 8px 16px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-cancel {
      background: transparent;
      color: #a8c7fa;
    }

    .btn-save {
      background: #a8c7fa;
      color: #062e6f;
    }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <header class="top-bar">
    <div class="top-left">
      <button class="icon-btn" onclick="resetChat()" title="Новый чат">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="9" x2="20" y2="9"></line>
          <line x1="4" y1="15" x2="20" y2="15"></line>
        </svg>
      </button>

      <button class="model-selector" onclick="openSettings()">
        <span>Ge...</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>

    <div class="top-right">
      <button class="temp-chat-btn" onclick="resetChat()" title="Очистить чат">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
      </button>

      <button class="upgrade-btn" onclick="openSettings()">Сменить план</button>

      <div class="avatar" onclick="openSettings()" title="Настройки API">Л</div>
    </div>
  </header>

  <!-- Центральная область -->
  <main class="main-area" id="mainArea">
    <div class="welcome-screen" id="welcomeScreen">
      <!-- Четырёхцветная звезда Gemini -->
      <svg class="sparkle-icon" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4285F4" />
            <stop offset="35%" stop-color="#34A853" />
            <stop offset="68%" stop-color="#FBBC05" />
            <stop offset="100%" stop-color="#EA4335" />
          </linearGradient>
        </defs>
        <path d="M24 2C24 14.15 33.85 24 46 24C33.85 24 24 33.85 24 46C24 33.85 14.15 24 2 24C14.15 24 24 14.15 24 2Z" fill="url(#gemGrad)" />
      </svg>
      <div class="welcome-text">Луи, вам слово</div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>
  </main>

  <!-- Нижняя панель ввода -->
  <footer class="bottom-bar">
    <div class="input-pill">
      <button class="plus-btn" onclick="resetChat()" title="Новый диалог">+</button>
      <input
        type="text"
        id="userInput"
        class="chat-input"
        placeholder="Спросить G..."
        autocomplete="off"
      />
      <button class="mic-btn" id="micBtn" title="Голосовой ввод">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button class="live-send-btn" id="actionBtn" onclick="sendMessage()">
        <!-- Иконка звуковых волн (когда поле пустое) -->
        <svg id="waveIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="6" y1="10" x2="6" y2="14"></line>
          <line x1="10" y1="7" x2="10" y2="17"></line>
          <line x1="14" y1="5" x2="14" y2="19"></line>
          <line x1="18" y1="9" x2="18" y2="15"></line>
        </svg>
        <!-- Иконка отправки (когда введён текст) -->
        <svg id="sendIcon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </div>
  </footer>

  <!-- Окно настроек API -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h3>Настройки Google AI Studio</h3>
      <label style="font-size:13px; color:#9aa0a6;">API Ключ:</label>
      <input type="text" id="apiKeyInput" />
      <label style="font-size:13px; color:#9aa0a6;">Модель:</label>
      <select id="modelSelect">
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (Быстрая)</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro (Умная)</option>
      </select>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSettings()">Отмена</button>
        <button class="btn-save" onclick="saveSettings()">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    // Ключ берется из памяти телефона, в открытом коде его нет
    let API_KEY = localStorage.getItem("gemini_api_key") || "";
    let MODEL = localStorage.getItem("gemini_model") || "gemini-3.8-flash";
    let chatHistory = [];

    const userInput = document.getElementById("userInput");
    const waveIcon = document.getElementById("waveIcon");
    const sendIcon = document.getElementById("sendIcon");
    const welcomeScreen = document.getElementById("welcomeScreen");
    const chatMessages = document.getElementById("chatMessages");
    const mainArea = document.getElementById("mainArea");

    userInput.addEventListener("input", () => {
      if (userInput.value.trim().length > 0) {
        waveIcon.style.display = "none";
        sendIcon.style.display = "block";
      } else {
        waveIcon.style.display = "block";
        sendIcon.style.display = "none";
      }
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    const micBtn = document.getElementById("micBtn");
    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = "ru-RU";
      micBtn.addEventListener("click", () => {
        recognition.start();
        micBtn.style.color = "#ea4335";
      });
      recognition.onresult = (event) => {
        userInput.value = event.results[0][0].transcript;
        userInput.dispatchEvent(new Event("input"));
        micBtn.style.color = "#c4c7c5";
      };
      recognition.onerror = () => {
        micBtn.style.color = "#c4c7c5";
      };
    }

    function appendMessage(role, text) {
      welcomeScreen.style.display = "none";
      chatMessages.style.display = "flex";

      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;

      if (role === "ai") {
        msgDiv.innerHTML = `
          <svg class="ai-badge" viewBox="0 0 48 48" fill="none">
            <path d="M24 2C24 14.15 33.85 24 46 24C33.85 24 24 33.85 24 46C24 33.85 14.15 24 2 24C14.15 24 24 14.15 24 2Z" fill="url(#gemGrad)" />
          </svg>
          <div class="ai-content"></div>
        `;
        msgDiv.querySelector(".ai-content").textContent = text;
      } else {
        msgDiv.textContent = text;
      }

      chatMessages.appendChild(msgDiv);
      mainArea.scrollTop = mainArea.scrollHeight;
      return msgDiv;
    }

    async function sendMessage() {
      if (!API_KEY) {
        alert("Сначала введи API-ключ! Нажми на оранжевую аватарку «Л» вверху.");
        openSettings();
        return;
      }

      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = "";
      userInput.dispatchEvent(new Event("input"));

      appendMessage("user", text);
      chatHistory.push({ role: "user", parts: [{ text }] });

      const loadingMsg = appendMessage("ai", "Думаю...");

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: chatHistory })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "Ошибка запроса к API");
        }

        const aiReply =
          data.candidates?.[0]?.content?.parts?.[0]?.text || "Нет ответа от модели.";

        loadingMsg.querySelector(".ai-content").textContent = aiReply;
        chatHistory.push({ role: "model", parts: [{ text: aiReply }] });
      } catch (err) {
        loadingMsg.querySelector(".ai-content").textContent = "Ошибка: " + err.message;
      }

      mainArea.scrollTop = mainArea.scrollHeight;
    }

    function resetChat() {
      chatHistory = [];
      chatMessages.innerHTML = "";
      chatMessages.style.display = "none";
      welcomeScreen.style.display = "flex";
    }

    function openSettings() {
      document.getElementById("apiKeyInput").value = API_KEY;
      document.getElementById("modelSelect").value = MODEL;
      document.getElementById("settingsModal").style.display = "flex";
    }

    function closeSettings() {
      document.getElementById("settingsModal").style.display = "none";
    }

    function saveSettings() {
      const newKey = document.getElementById("apiKeyInput").value.trim();
      const newModel = document.getElementById("modelSelect").value;
      if (newKey) {
        API_KEY = newKey;
        localStorage.setItem("gemini_api_key", API_KEY);
      }
      MODEL = newModel;
      localStorage.setItem("gemini_model", MODEL);
      closeSettings();
    }
  </script>
</body>
      </html>
